<text x="928" y="814" fill="#7d8894" font-family="Menlo,Consolas,monospace" font-size="12" text-anchor="start">GND</text>
<line x1="920" y1="810" x2="920" y2="820" stroke="#7d8894" stroke-width="2"/><polygon points="913,820 927,820 920,830" fill="#7d8894"/><line x1="911" y1="834" x2="929" y2="834" stroke="#7d8894" stroke-width="2"/><line x1="915" y1="838" x2="925" y2="838" stroke="#7d8894" stroke-width="2"/>
<rect x="880" y="840" width="300" height="130" rx="8" fill="#1a1f27" stroke="#5c6876" stroke-width="1.5"/>
<text x="894" y="866" fill="#e6eaf0" font-family="Helvetica,Arial" font-size="16" font-weight="bold">Record indicator LED</text>
<text x="894" y="885" fill="#8b97a6" font-family="Helvetica,Arial" font-size="12">3 mm red LED + 220 R series resistor</text>
<circle cx="880" cy="880" r="3.5" fill="#d6a13a"/><text x="888" y="884" fill="#d6a13a" font-family="Menlo,Consolas,monospace" font-size="12" text-anchor="start"></text>
<circle cx="920" cy="970" r="3.5" fill="#7d8894"/>
<text x="928" y="974" fill="#7d8894" font-family="Menlo,Consolas,monospace" font-size="12" text-anchor="start">GND</text>
<line x1="920" y1="970" x2="920" y2="980" stroke="#7d8894" stroke-width="2"/><polygon points="913,980 927,980 920,990" fill="#7d8894"/><line x1="911" y1="994" x2="929" y2="994" stroke="#7d8894" stroke-width="2"/><line x1="915" y1="998" x2="925" y2="998" stroke="#7d8894" stroke-width="2"/>
<line x1="490" y1="350" x2="880" y2="350" stroke="#d05a5a" stroke-width="2"/>
<text x="655.0" y="342" fill="#d05a5a" font-family="Menlo,Consolas,monospace" font-size="11.5" text-anchor="middle">3V3 (board LDO)</text>
<line x1="490" y1="420" x2="880" y2="420" stroke="#4f9de0" stroke-width="2"/>
<text x="655.0" y="412" fill="#4f9de0" font-family="Menlo,Consolas,monospace" font-size="11.5" text-anchor="middle">SDA</text>
<line x1="490" y1="490" x2="880" y2="490" stroke="#4f9de0" stroke-width="2"/>
<text x="655.0" y="482" fill="#4f9de0" font-family="Menlo,Consolas,monospace" font-size="11.5" text-anchor="middle">SCL</text>
<line x1="490" y1="630" x2="880" y2="630" stroke="#d6a13a" stroke-width="2"/>
<text x="655.0" y="622" fill="#d6a13a" font-family="Menlo,Consolas,monospace" font-size="11.5" text-anchor="middle">REC</text>
<line x1="490" y1="740" x2="880" y2="740" stroke="#d6a13a" stroke-width="2"/>
<text x="655.0" y="732" fill="#d6a13a" font-family="Menlo,Consolas,monospace" font-size="11.5" text-anchor="middle">SCENE</text>
<line x1="490" y1="880" x2="880" y2="880" stroke="#d6a13a" stroke-width="2"/>
<text x="655.0" y="872" fill="#d6a13a" font-family="Menlo,Consolas,monospace" font-size="11.5" text-anchor="middle">LED + 220 R</text>
<rect x="60" y="930" width="320" height="100" rx="8" fill="#1a1f27" stroke="#5c6876" stroke-width="1.5"/>
<text x="74" y="956" fill="#e6eaf0" font-family="Helvetica,Arial" font-size="16" font-weight="bold">USB-C (host computer)</text>
<text x="74" y="975" fill="#8b97a6" font-family="Helvetica,Arial" font-size="12">5 V + GND + native CDC, 250 mA advertised</text>
<line x1="210" y1="850" x2="210" y2="930" stroke="#7d8894" stroke-width="2"/>
<rect x="1220" y="150" width="340" height="700" rx="8" fill="#1a1f27" stroke="#5c6876" stroke-width="1.5"/>
<text x="1234" y="176" fill="#e6eaf0" font-family="Helvetica,Arial" font-size="16" font-weight="bold">Notes</text>
<text x="1236" y="230" fill="#8b97a6" font-family="Menlo,Consolas,monospace" font-size="12" text-anchor="start">1. USB-C is the only power and data source:</text>
<text x="1236" y="253" fill="#8b97a6" font-family="Menlo,Consolas,monospace" font-size="12" text-anchor="start">   no battery, no radio, no mains input.</text>
<text x="1236" y="276" fill="#8b97a6" font-family="Menlo,Consolas,monospace" font-size="12" text-anchor="start">2. The STEMMA QT connector of the QT Py is</text>
<text x="1236" y="299" fill="#8b97a6" font-family="Menlo,Consolas,monospace" font-size="12" text-anchor="start">   I2C1: SDA = GPIO22, SCL = GPIO23.</text>
<text x="1236" y="322" fill="#8b97a6" font-family="Menlo,Consolas,monospace" font-size="12" text-anchor="start">3. OLED connector order on both ends:</text>
<text x="1236" y="345" fill="#8b97a6" font-family="Menlo,Consolas,monospace" font-size="12" text-anchor="start">   GND, 3V3, SDA, SCL (STEMMA QT standard).</text>
<text x="1236" y="368" fill="#8b97a6" font-family="Menlo,Consolas,monospace" font-size="12" text-anchor="start">   The OLED sits on the STEMMA QT port of the</text>
<text x="1236" y="391" fill="#8b97a6" font-family="Menlo,Consolas,monospace" font-size="12" text-anchor="start">   board, so display and MCU need only one</text>
<text x="1236" y="414" fill="#8b97a6" font-family="Menlo,Consolas,monospace" font-size="12" text-anchor="start">   4 pin cable (product 4210, 100 mm).</text>
<text x="1236" y="437" fill="#8b97a6" font-family="Menlo,Consolas,monospace" font-size="12" text-anchor="start">4. The two buttons and the LED are wired to</text>
<text x="1236" y="460" fill="#8b97a6" font-family="Menlo,Consolas,monospace" font-size="12" text-anchor="start">   the castellated pads of the board with</text>
<text x="1236" y="483" fill="#8b97a6" font-family="Menlo,Consolas,monospace" font-size="12" text-anchor="start">   22 AWG wire; they are mounted in the face</text>
<text x="1236" y="506" fill="#8b97a6" font-family="Menlo,Consolas,monospace" font-size="12" text-anchor="start">   panel.</text>
<text x="1236" y="529" fill="#8b97a6" font-family="Menlo,Consolas,monospace" font-size="12" text-anchor="start">5. Buttons use the internal pull-up of the</text>
<text x="1236" y="552" fill="#8b97a6" font-family="Menlo,Consolas,monospace" font-size="12" text-anchor="start">   RP2040, so no external resistor is needed.</text>
<text x="1236" y="575" fill="#8b97a6" font-family="Menlo,Consolas,monospace" font-size="12" text-anchor="start">6. LED current: (3.3 V - 2.0 V) / 220 R</text>
<text x="1236" y="598" fill="#8b97a6" font-family="Menlo,Consolas,monospace" font-size="12" text-anchor="start">   = 5.9 mA.</text>
<text x="1236" y="621" fill="#8b97a6" font-family="Menlo,Consolas,monospace" font-size="12" text-anchor="start">7. The red LED is driven from GPIO28 and is</text>
<text x="1236" y="644" fill="#8b97a6" font-family="Menlo,Consolas,monospace" font-size="12" text-anchor="start">   only lit while the host confirms that OBS</text>
<text x="1236" y="667" fill="#8b97a6" font-family="Menlo,Consolas,monospace" font-size="12" text-anchor="start">   is really recording.</text>
<text x="1236" y="690" fill="#8b97a6" font-family="Menlo,Consolas,monospace" font-size="12" text-anchor="start">8. The panel buttons and the LED share the</text>
<text x="1236" y="713" fill="#8b97a6" font-family="Menlo,Consolas,monospace" font-size="12" text-anchor="start">   GND of the board - one common wire each.</text>
<text x="40" y="1056" fill="#8b97a6" font-family="Menlo,Consolas,monospace" font-size="11.5" text-anchor="start">Sources: Adafruit 4900 / 938 / 367 / 777 - Adafruit_QT_Py-RP2040-PCB (Eagle) - arduino-pico 6.4.0 variants/adafruit_qtpy/pins_arduino.h</text>
</svg>