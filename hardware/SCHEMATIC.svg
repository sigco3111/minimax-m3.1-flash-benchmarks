<text x="928" y="674" fill="#7d8894" font-family="Menlo,Consolas,monospace" font-size="12" text-anchor="start">GND</text>
<line x1="920" y1="670" x2="920" y2="680" stroke="#7d8894" stroke-width="2"/><polygon points="913,680 927,680 920,690" fill="#7d8894"/><line x1="911" y1="694" x2="929" y2="694" stroke="#7d8894" stroke-width="2"/><line x1="915" y1="698" x2="925" y2="698" stroke="#7d8894" stroke-width="2"/>
<rect x="880" y="690" width="300" height="120" rx="8" fill="#1a1f27" stroke="#5c6876" stroke-width="1.5"/>
<text x="894" y="716" fill="#e6eaf0" font-family="Helvetica,Arial" font-size="16" font-weight="bold">SCENE button (6 mm tact)</text>
<text x="894" y="735" fill="#8b97a6" font-family="Helvetica,Arial" font-size="12">press fit in the face panel, internal pull-up</text>
<circle cx="880" cy="740" r="3.5" fill="#d6a13a"/><text x="888" y="744" fill="#d6a13a" font-family="Menlo,Consolas,monospace" font-size="12" text-anchor="start"></text>
